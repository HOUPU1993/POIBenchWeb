<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POIBench</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f6fb;
      color: #222;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }
    .card {
      background: #fff;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 520px;
    }
    h1 { margin: 0 0 4px; }
    .sub { margin: 0 0 24px; color: #666; }
    fieldset { border: 1px solid #ddd; border-radius: 8px; margin: 0 0 16px; padding: 12px 16px; }
    legend { font-weight: 600; padding: 0 6px; }
    label { display: inline-block; width: 48%; font-size: 14px; color: #555; }
    input { width: 90%; padding: 6px 8px; margin-top: 4px; border: 1px solid #ccc; border-radius: 6px; }
    button { width: 100%; padding: 10px; border: 0; border-radius: 8px; background: #5b5bd6; color: #fff; font-size: 16px; cursor: pointer; }
    button:hover { background: #4a4ac4; }
    #result { margin-top: 20px; padding: 16px; border-radius: 8px; background: #f0f0f7; display: none; }
    .ok { color: #1a7f37; font-weight: 600; }
    .no { color: #cf222e; font-weight: 600; }
    footer { margin-top: 20px; font-size: 12px; color: #999; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📍 POIBench</h1>
    <p class="sub">Is the comparable POI within the matching distance of the reference POI?</p>

    <fieldset>
      <legend>Reference POI</legend>
      <label>Latitude <input id="ref_lat" type="number" step="any" value="34.4140"></label>
      <label>Longitude <input id="ref_lon" type="number" step="any" value="-119.8489"></label>
    </fieldset>

    <fieldset>
      <legend>Comparable POI</legend>
      <label>Latitude <input id="cmp_lat" type="number" step="any" value="34.4208"></label>
      <label>Longitude <input id="cmp_lon" type="number" step="any" value="-119.6982"></label>
    </fieldset>

    <fieldset>
      <legend>Threshold</legend>
      <label>Distance (m) <input id="threshold_m" type="number" value="1000"></label>
    </fieldset>

    <button id="run">Compute on server</button>
    <div id="result"></div>
    <footer>Version 2 · computed by the POIBench server</footer>
  </div>

  <script>
    const ids = ["ref_lat", "ref_lon", "cmp_lat", "cmp_lon", "threshold_m"];
    const box = document.getElementById("result");

    document.getElementById("run").addEventListener("click", async () => {
      const body = Object.fromEntries(ids.map(id => [id, parseFloat(document.getElementById(id).value)]));
      box.style.display = "block";
      box.textContent = "Computing...";
      try {
        const res = await fetch("/api/distance", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        if (!res.ok) throw new Error("Invalid input (HTTP " + res.status + ")");
        const r = await res.json();
        box.innerHTML =
          `Distance: <b>${r.distance_m.toLocaleString()} m</b><br>` +
          (r.is_candidate
            ? `<span class="ok">✔ Within ${r.threshold_m} m — candidate match</span>`
            : `<span class="no">✘ Beyond ${r.threshold_m} m — not a candidate</span>`);
      } catch (e) {
        box.textContent = "Error: " + e.message;
      }
    });
  </script>
</body>
</html>
